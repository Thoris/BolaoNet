      #     echo "BUILD_NUMBER=$buildNumber" >> $env:GITHUB_ENV

      # =========================
      # ARTIFACT
      # =========================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: deploy

          
