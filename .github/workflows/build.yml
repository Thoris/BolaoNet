name: CI BolaoNet

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Tipo de deploy"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - db
          - ftp_full
          - ftp_delta
          - full
      environment_name:
        description: "Ambiente"
        required: true
        default: "prd"
        type: choice
        options:
          - dev
          - stg
          - bkp
          - prd
env:
  SOLUTION: 'BolaoNet.sln'
  PROJECT_DEPLOY: 'BolaoNet.MVC\BolaoNet.MVC.csproj'
  BUILD_CONFIGURATION: Release 
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
  
jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # RESTORE
      # =========================
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: nuget restore ${{ env.SOLUTION }} 

      # =========================
      # BUILD
      # ========================= 
      - name: Build solution
        run: msbuild ${{ env.SOLUTION }} /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform="Any CPU"

      # =========================
      # TEST
      # =========================
      - name: Test
        run: msbuild ${{ env.SOLUTION }} /p:RunTests=true

      # =========================
      # SET VERSION  
      # =========================
      - name: Set Assembly Version
        shell: pwsh
        run: |
          $version = "2.$(Get-Date -Format yy.MM.dd)$env:GITHUB_RUN_NUMBER"
          Write-Host "Version: $version"

          Get-ChildItem -Recurse -Filter AssemblyInfo.cs | ForEach-Object {
            (Get-Content $_.FullName) `
              -replace 'AssemblyVersion\(".*"\)', "AssemblyVersion(`"$version`")" `
              -replace 'AssemblyFileVersion\(".*"\)', "AssemblyFileVersion(`"$version`")" |
              Set-Content $_.FullName
          }

      # =========================
      # PUBLISH  
      # ========================= 
      - name: Build MVC
        run: msbuild ${{ env.PROJECT_DEPLOY }} /p:GenerateDocumentation=true /p:DeployOnBuild=true  /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:DeployDefaultTarget=WebPublish /p:PublishProfile=IIS 

      # =========================
      # DACPAC COPY  
      # ========================= 
      - name: Copy DacPac
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deploy | Out-Null

          $files = Copy-Item "${{ github.workspace }}\BolaoNet.Database.SqlServer\bin\Release\*.dacpac" deploy -Force -PassThru

          Write-Host "Arquivos copiados: $($files.Count)"

      # =========================
      # TEMPLATES
      # =========================
      - name: Copy TemplatesHtml
        shell: pwsh
        run: |
        
          $source = "${{ github.workspace }}\BolaoNet.Infra.Notification.Mail\TemplatesHtml"
          $dest = "${{ github.workspace }}\deploy\MVC\TemplatesHtml"

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $files = Get-ChildItem -Path $source -Recurse

          Write-Host "Arquivos encontrados: $($files.Count)"

          Copy-Item "$source\*" -Destination $dest -Recurse -Force

          Write-Host "Copy finalizado"

      # =========================
      # AJUSTES DE WEBCONFIG E LOG
      # =========================
      - name: Replace Web.config (robusto)
        shell: pwsh
        run: |
          $path = "${{ github.workspace }}\deploy\MVC"

          if (!(Test-Path $path)) {
            $path = "${{ github.workspace }}\BolaoNet.MVC\obj\Release\Package\PackageTmp"
            Write-Host "Fallback path: $path"
          }

          $webConfig = "$path\web.config"
          $devopsConfig = "$path\web.devops.config"

          if (Test-Path $devopsConfig) {

            if (Test-Path $webConfig) {
              Remove-Item $webConfig -Force
            }

            Copy-Item $devopsConfig $webConfig -Force
            Remove-Item $devopsConfig -Force

            Write-Host "Config substituído com sucesso"

          } else {
            Write-Host "web.devops.config não encontrado"
          }

      # =========================
      # ZIP
      # ========================= 
      - name: Ensure publish folder exists
        shell: pwsh
        run: |
          if (!(Test-Path "${{ github.workspace }}\deploy\MVC")) {
            New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\deploy\MVC"
          }

      - name: Debug publish folder
        shell: pwsh
        run: |
          Write-Host "=== SEARCH publish FILES ==="

          Get-ChildItem "${{ github.workspace }}" -Recurse -File |
            Where-Object { $_.FullName -like "*publish*" } |
            Select-Object FullName

          Write-Host "=== DIRECT publish CONTENT ==="

          Get-ChildItem "${{ github.workspace }}\publish" -Recurse -Force -ErrorAction SilentlyContinue |
            Select FullName


      - name: Create ZIP
        shell: pwsh
        run: |
          $buildNumber = "2.$(Get-Date -Format yy.MM.dd)$env:GITHUB_RUN_NUMBER"

          $source = "${{ github.workspace }}\deploy\MVC"

          Write-Host "Checking: $source"

          if (!(Test-Path $source)) {
            Write-Host "FALLBACK: trying PackageTmp"

            $source = "${{ github.workspace }}\BolaoNet.MVC\obj\Release\Package\PackageTmp"

            if (!(Test-Path $source)) {
              throw "Nenhum output de publish encontrado"
            }
          }

          New-Item -ItemType Directory -Force -Path deploy/zip | Out-Null

          Compress-Archive -Path "$source\*" -DestinationPath "deploy/zip/Mvc_$buildNumber.zip"

          echo "BUILD_NUMBER=$buildNumber" >> $env:GITHUB_ENV

          Write-Host "ZIP criado com sucesso"
 
      # =========================
      # ARTIFACT
      # =========================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: drop
          path: deploy

# =========================
# BASE (REUTILIZADO)
# =========================
  prepare-deploy:
    needs: build
    runs-on: windows-latest
    environment: ${{ github.event.inputs.environment_name }}

    #outputs:
    #  dacpac: ${{ steps.dacpac.outputs.path }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drop
          
      - name: Locate DACPAC
        id: dacpac
        shell: pwsh
        run: | 
          Write-Host "Procurando DACPAC..."

          Get-ChildItem -Recurse | Select FullName

          $dacpac = Get-ChildItem -Recurse -Filter *.dacpac | Select-Object -First 1

          if (!$dacpac) {
            throw "DACPAC não encontrado"
          }

          Write-Host "DACPAC encontrado: $($dacpac.FullName)"

          echo "path=$($dacpac.FullName)" >> $env:GITHUB_OUTPUT

# =========================
# DEPLOY DB (BOTÃO)
# =========================
  deploy-db:
    needs: prepare-deploy 
    if: github.event.inputs.deploy_target == 'db' || github.event.inputs.deploy_target == 'full'
    runs-on: windows-latest
    environment: ${{ github.event.inputs.environment_name }}

    steps:
      - name: Install SqlPackage
        run: choco install sqlpackage

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: drop

      - name: Locate DACPAC
        id: dacpac
        shell: pwsh
        run: | 
          Write-Host "Procurando DACPAC..."

          Get-ChildItem -Recurse | Select FullName

          $dacpac = Get-ChildItem -Recurse -Filter *.dacpac | Select-Object -First 1

          if (!$dacpac) {
            throw "DACPAC não encontrado"
          }

          Write-Host "DACPAC encontrado: $($dacpac.FullName)"

          echo "path=$($dacpac.FullName)" >> $env:GITHUB_OUTPUT

      - name: Debug DACPAC path
        run: |
          echo "DACPAC PATH: ${{ steps.dacpac.outputs.path }}"
        #  echo "DACPAC PATH: ${{ needs.prepare-deploy.outputs.dacpac }}"

      - name: Deploy Database
        run: |
          sqlpackage /Action:Publish `
          /SourceFile:"${{ steps.dacpac.outputs.path }}" `
          /TargetConnectionString:"Server=${{ vars.DB_SERVER }};Database=${{ vars.DB_INITIAL_CATALOG }};User Id=${{ vars.DB_USERNAME }};Password=${{ vars.DB_PASSWORD }};TrustServerCertificate=True" `
          /p:BlockOnPossibleDataLoss=false /p:DropIndexesNotInSource=False


# =========================
# DEPLOY FTP
# =========================
  deploy-ftp:
    needs: [prepare-deploy]
    if: contains(fromJson('["ftp_full","ftp_delta","full"]'), github.event.inputs.deploy_target)
    runs-on: windows-latest
    environment: ${{ github.event.inputs.environment_name }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: drop

      - name: Extract files
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Recurse -Filter "*.zip" | Select-Object -First 1

          if (!$zip) {
            throw "ZIP não encontrado"
          }

          Write-Host "ZIP encontrado: $($zip.FullName)"

          Expand-Archive -Path $zip.FullName -DestinationPath extracted -Force


      - name: Replace tokens 
        shell: pwsh
        run: |
          $file = Get-ChildItem "extracted" -Filter web.config -Recurse |
            Where-Object {
              $_.FullName -notmatch "\\bin\\|\\obj\\|\\Views\\|\\Scripts\\"
            } |
            Select-Object -First 1

          if (!$file) {
            throw "web.config raiz não encontrado"
          }

          Write-Host "Processando: $($file.FullName)"

          # LEITURA SEGURA
          $content = Get-Content $file.FullName -Raw

          # =========================
          # DATABASE
          # =========================
          $content = $content -replace '_#db.server#_', '${{ vars.DB_SERVER }}'
          $content = $content -replace '_#db.initial_catalog#_', '${{ vars.DB_INITIAL_CATALOG }}'
          $content = $content -replace '_#db.username#_', '${{ vars.DB_USERNAME }}'
          $content = $content -replace '_#db.password#_', '${{ vars.DB_PASSWORD }}'
          $content = $content -replace '_#poolingconfig#_', '${{ vars.DB_POOLING_CONFIG }}'

          # =========================
          # MAIL
          # =========================
          $content = $content -replace '_#mail.enablessl#_', '${{ vars.MAIL_ENABLE_SSL }}'
          $content = $content -replace '_#mail.smtp#_', '${{ vars.MAIL_SMTP }}'
          $content = $content -replace '_#mail.port#_', '${{ vars.MAIL_PORT }}'
          $content = $content -replace '_#mail.from#_', '${{ vars.MAIL_FROM }}'
          $content = $content -replace '_#mail.password#_', '${{ vars.MAIL_PASSWORD }}'
          $content = $content -replace '_#mail.signature#_', '${{ vars.MAIL_SIGNATURE }}'
          $content = $content -replace '_#mail.url#_', '${{ vars.MAIL_URL }}'
          $content = $content -replace '_#mail.templates.folder#_', '${{ vars.MAIL_TEMPLATES_FOLDER }}'

          # =========================
          # WEB API
          # =========================
          $content = $content -replace '_#webapi.url#_', '${{ vars.API_URL }}'
          $content = $content -replace '_#webapi.token#_', '${{ vars.API_TOKEN }}'

          # =========================
          # ENVIRONMENT
          # =========================
          $content = $content -replace '_#environment#_', '${{ vars.ENVIRONMENT }}'

          # =========================
          # GOOGLE ANALYTICS
          # =========================
          $content = $content -replace '_#googleanalytics.id#_', '${{ vars.GOOGLEANALYTICS_ID }}'

          # GRAVAÇÃO
          Set-Content $file.FullName $content

          Write-Host "✔ Tokens substituídos com sucesso"

      # - name: Debug Web.config (sanitizado)
      #   shell: pwsh
      #   run: |
      #     $file = Get-ChildItem "extracted" -Recurse -Filter web.config |
      #       Where-Object {
      #         $_.FullName -notmatch "\\bin\\|\\obj\\|\\Views\\|\\Scripts\\"
      #       } |
      #       Select-Object -First 1

      #     if (!$file) {
      #       throw "web.config não encontrado"
      #     }

      #     $content = Get-Content $file.FullName -Raw

      #     # mascara senha
      #     $content = $content -replace '(password=)[^";]+', '$1*****'

      #     Write-Host "=== WEB.CONFIG (SANITIZADO) ==="
      #     Write-Host $content

      - name: FTP FULL
        if: github.event.inputs.deploy_target == 'ftp_full' || github.event.inputs.deploy_target == 'full'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ vars.FTP_PASSWORD }}
          local-dir: extracted/
          server-dir: ${{ vars.FTP_DIRECTORY }}

      - name: FTP DELTA
        if: github.event.inputs.deploy_target == 'ftp_delta'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ vars.FTP_PASSWORD }}
          local-dir: extracted/
          server-dir: ${{ vars.FTP_DIRECTORY }}
          exclude: |
            **/Content/**
            **/content/**
            **/*.jpg
            **/*.png
            **/*.gif
            **/*.mp4
            **/*.zip
            **/*.rar
 
